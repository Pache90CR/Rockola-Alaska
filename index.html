<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rockola Alaska - Reproductor TV</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            background-color: #0b0c10;
            color: #ffffff;
            font-family: 'Segoe UI', Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }
        header {
            background-color: #1f2833;
            padding: 10px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #66fcf1;
        }
        .brand { font-size: 1.3rem; font-weight: bold; color: #66fcf1; }
        .status-badge { background-color: #45a29e; color: #0b0c10; padding: 4px 10px; border-radius: 15px; font-weight: bold; font-size: 0.8rem; }
        .main-layout { display: flex; flex: 1; height: calc(100vh - 55px); }
        
        #player-section { flex: 2.5; display: flex; flex-direction: column; background-color: #000000; padding: 15px; }
        #player-wrapper { flex: 1; position: relative; border-radius: 10px; overflow: hidden; background: #000; }
        #player { width: 100%; height: 100%; }
        
        .controls-bar {
            background-color: #1f2833;
            padding: 12px 15px;
            border-radius: 10px;
            margin-top: 10px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            border: 1px solid #2c3846;
        }
        .progress-container { display: flex; align-items: center; gap: 10px; font-size: 0.85rem; color: #66fcf1; }
        .progress-bar { flex: 1; height: 6px; background: #0b0c10; border-radius: 3px; outline: none; accent-color: #66fcf1; cursor: pointer; }
        .buttons-row { display: flex; align-items: center; justify-content: space-between; }
        .btn-ctrl { background: #0b0c10; border: 1px solid #45a29e; color: #66fcf1; padding: 8px 14px; border-radius: 6px; font-weight: bold; cursor: pointer; }
        .btn-ctrl:active { background: #66fcf1; color: #0b0c10; }
        .volume-box { display: flex; align-items: center; gap: 8px; font-size: 0.85rem; color: #c5c6c7; }
        .volume-slider { width: 80px; accent-color: #66fcf1; }

        #sidebar { flex: 1; background-color: #1f2833; padding: 15px; border-left: 1px solid #45a29e; display: flex; flex-direction: column; overflow-y: auto; }
        .tabs { display: flex; gap: 8px; margin-bottom: 12px; }
        .tab-btn { flex: 1; padding: 8px; background: #0b0c10; border: 1px solid #2c3846; color: #c5c6c7; border-radius: 6px; font-weight: bold; cursor: pointer; }
        .tab-btn.active { background: #66fcf1; color: #0b0c10; border-color: #66fcf1; }
        
        .queue-item {
            background-color: #0b0c10;
            border-radius: 8px;
            padding: 10px 12px;
            margin-bottom: 8px;
            border-left: 4px solid #45a29e;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: background 0.2s;
        }
        .queue-item:hover { background-color: #1a222d; }
        .queue-item.playing { border-left-color: #66fcf1; background-color: #121921; }
        
        .song-clickable { flex: 1; cursor: pointer; }
        .song-title { font-weight: bold; font-size: 0.85rem; color: #ffffff; line-height: 1.2; }
        .song-meta { font-size: 0.75rem; color: #c5c6c7; margin-top: 3px; }
        
        .btn-star { background: transparent; border: none; color: #66fcf1; font-size: 1.1rem; cursor: pointer; padding: 5px; }
    </style>
</head>
<body>

    <header>
        <div class="brand">❄️ BAR RESTAURANTE ALASKA — ROCKOLA</div>
        <div class="status-badge" id="connection-status">● Activo</div>
    </header>

    <div class="main-layout">
        <div id="player-section">
            <div id="player-wrapper">
                <div id="player"></div>
            </div>

            <div class="controls-bar">
                <div class="progress-container">
                    <span id="curr-time">0:00</span>
                    <input type="range" id="progress-bar" class="progress-bar" value="0" min="0" max="100" onchange="seekVideo(this.value)">
                    <span id="total-time">0:00</span>
                </div>
                <div class="buttons-row">
                    <div>
                        <button class="btn-ctrl" onclick="seekRelative(-10)">⏮ -10s</button>
                        <button class="btn-ctrl" id="btn-play" onclick="togglePlay()">⏸ Pausa</button>
                        <button class="btn-ctrl" onclick="seekRelative(10)">+10s ⏭</button>
                        <button class="btn-ctrl" onclick="skipSong()">⏭ Saltar</button>
                    </div>
                    <div class="volume-box">
                        🔊 <input type="range" class="volume-slider" min="0" max="100" value="100" oninput="setVolume(this.value)">
                    </div>
                </div>
            </div>
        </div>

        <div id="sidebar">
            <div class="tabs">
                <button class="tab-btn active" id="tab-queue-btn" onclick="switchTab('queue')">Fila de Música</button>
                <button class="tab-btn" id="tab-favs-btn" onclick="switchTab('favs')">⭐ Favoritos</button>
            </div>
            <div id="tab-content">
                <div id="queue-list">Cargando canciones...</div>
            </div>
        </div>
    </div>

    <script src="https://www.youtube.com/iframe_api"></script>

    <script>
        const SUPABASE_URL = 'https://zothgtvmkuranngxmumc.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpvdGhndHZta3VyYW5uZ3htdW1jIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI5ODYxMTksImV4cCI6MjEwODU2MjExOX0.rdxY-oNicD1y9TXkAqXpaArDhDP4i_UgLazutFNbuTQ';

        let player = null;
        let isPlayerReady = false;
        let isPlaying = false;
        let currentSongId = null;
        let queueData = [];
        let activeTab = 'queue';

        window.onYouTubeIframeAPIReady = () => {
            player = new YT.Player('player', {
                playerVars: { 'autoplay': 1, 'controls': 0 },
                events: {
                    'onReady': () => {
                        isPlayerReady = true;
                        if (!isPlaying && queueData.length > 0) playNext();
                    },
                    'onStateChange': onPlayerStateChange
                }
            });
        };

        async function fetchQueue() {
            const endpoint = `${SUPABASE_URL}/rest/v1/cola_reproduccion?select=*&order=created_at.asc`;
            try {
                const response = await fetch(endpoint, {
                    headers: { 'apikey': SUPABASE_KEY, 'Authorization': 'Bearer ' + SUPABASE_KEY }
                });
                if (response.ok) {
                    queueData = await response.json() || [];
                    if (activeTab === 'queue') renderQueue();
                    if (isPlayerReady && !isPlaying && queueData.length > 0) playNext();
                }
            } catch (err) { console.error("Error cargando fila:", err); }
        }

        function renderQueue() {
            const listDiv = document.getElementById('queue-list');
            listDiv.innerHTML = '';
            if (queueData.length === 0) {
                listDiv.innerHTML = '<p style="color:#c5c6c7;">Sin canciones en fila. Agrega desde el celular.</p>';
                return;
            }
            queueData.forEach((song, idx) => {
                const item = document.createElement('div');
                const isCurrent = song.id === currentSongId;
                item.className = `queue-item ${isCurrent ? 'playing' : ''}`;
                
                item.innerHTML = `
                    <div class="song-clickable" onclick="forcePlay('${song.id}', '${song.video_id}')">
                        <div class="song-title">${idx + 1}. ${song.title}</div>
                        <div class="song-meta">${isCurrent ? '▶ Reproduciendo ahora' : 'Haz clic para reproducir 🎵'}</div>
                    </div>
                    <button class="btn-star" onclick="saveFav('${song.video_id}', '${song.title.replace(/'/g, "\\'")}')" title="Guardar en Favoritos">⭐</button>
                `;
                listDiv.appendChild(item);
            });
        }

        function renderFavs() {
            const listDiv = document.getElementById('queue-list');
            listDiv.innerHTML = '';
            const favs = JSON.parse(localStorage.getItem('alaska_favs') || '[]');
            if (favs.length === 0) {
                listDiv.innerHTML = '<p style="color:#c5c6c7;">No tienes favoritos guardados todavía.</p>';
                return;
            }
            favs.forEach((fav, idx) => {
                const item = document.createElement('div');
                item.className = 'queue-item';
                item.innerHTML = `
                    <div style="flex:1;">
                        <div class="song-title">${fav.title}</div>
                    </div>
                    <button class="btn-ctrl" style="padding:4px 8px; font-size:0.75rem;" onclick="addFavToQueue('${fav.video_id}', '${fav.title.replace(/'/g, "\\'")}')">+ Añadir</button>
                `;
                listDiv.appendChild(item);
            });
        }

        function switchTab(tab) {
            activeTab = tab;
            document.getElementById('tab-queue-btn').className = `tab-btn ${tab === 'queue' ? 'active' : ''}`;
            document.getElementById('tab-favs-btn').className = `tab-btn ${tab === 'favs' ? 'active' : ''}`;
            if (tab === 'queue') renderQueue();
            else renderFavs();
        }

        function saveFav(videoId, title) {
            let favs = JSON.parse(localStorage.getItem('alaska_favs') || '[]');
            if (!favs.some(f => f.video_id === videoId)) {
                favs.push({ video_id: videoId, title: title });
                localStorage.setItem('alaska_favs', JSON.stringify(favs));
                alert("⭐ Guardado en Favoritos");
            } else {
                alert("Ya está en tus favoritos");
            }
        }

        async function addFavToQueue(videoId, title) {
            const endpoint = `${SUPABASE_URL}/rest/v1/cola_reproduccion`;
            await fetch(endpoint, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'apikey': SUPABASE_KEY, 'Authorization': 'Bearer ' + SUPABASE_KEY, 'Prefer': 'return=minimal' },
                body: JSON.stringify([{ video_id: videoId, title: title }])
            });
            fetchQueue();
            switchTab('queue');
        }

        async function onPlayerStateChange(event) {
            if (event.data === YT.PlayerState.ENDED && currentSongId) {
                skipSong();
            }
        }

        async function forcePlay(songId, videoId) {
            if (currentSongId && currentSongId !== songId) {
                await fetch(`${SUPABASE_URL}/rest/v1/cola_reproduccion?id=eq.${currentSongId}`, {
                    method: 'DELETE',
                    headers: { 'apikey': SUPABASE_KEY, 'Authorization': 'Bearer ' + SUPABASE_KEY }
                });
            }
            currentSongId = songId;
            isPlaying = true;
            player.loadVideoById(videoId);
            document.getElementById('btn-play').textContent = "⏸ Pausa";
            fetchQueue();
        }

        async function skipSong() {
            if (currentSongId) {
                await fetch(`${SUPABASE_URL}/rest/v1/cola_reproduccion?id=eq.${currentSongId}`, {
                    method: 'DELETE',
                    headers: { 'apikey': SUPABASE_KEY, 'Authorization': 'Bearer ' + SUPABASE_KEY }
                });
            }
            queueData = queueData.filter(song => song.id !== currentSongId);
            currentSongId = null;
            isPlaying = false;
            renderQueue();
            playNext();
        }

        function playNext() {
            if (isPlayerReady && queueData.length > 0) {
                const nextSong = queueData[0];
                currentSongId = nextSong.id;
                isPlaying = true;
                renderQueue(); 
                player.loadVideoById(nextSong.video_id);
                document.getElementById('btn-play').textContent = "⏸ Pausa";
            }
        }

        function togglePlay() {
            if (!player || !isPlayerReady) return;
            const state = player.getPlayerState();
            if (state === YT.PlayerState.PLAYING) {
                player.pauseVideo();
                document.getElementById('btn-play').textContent = "▶ Play";
            } else {
                player.playVideo();
                document.getElementById('btn-play').textContent = "⏸ Pausa";
            }
        }

        function seekRelative(sec) {
            if (player && isPlayerReady) player.seekTo(player.getCurrentTime() + sec, true);
        }

        function seekVideo(val) {
            if (player && isPlayerReady && player.getDuration()) {
                const targetTime = (val / 100) * player.getDuration();
                player.seekTo(targetTime, true);
            }
        }

        function setVolume(val) {
            if (player && isPlayerReady) player.setVolume(val);
        }

        function formatTime(s) {
            const mins = Math.floor(s / 60);
            const secs = Math.floor(s % 60);
            return `${mins}:${secs < 10 ? '0' : ''}${secs}`;
        }

        setInterval(() => {
            if (player && isPlayerReady && player.getPlayerState() === YT.PlayerState.PLAYING) {
                const current = player.getCurrentTime();
                const total = player.getDuration();
                if (total > 0) {
                    document.getElementById('progress-bar').value = (current / total) * 100;
                    document.getElementById('curr-time').textContent = formatTime(current);
                    document.getElementById('total-time').textContent = formatTime(total);
                }
            }
        }, 1000);

        fetchQueue();
        setInterval(fetchQueue, 3000);
    </script>
</body>
</html>
