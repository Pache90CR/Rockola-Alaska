<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Rockola Alaska - Control</title>
    <style>
        body { margin: 0; background-color: #0f0f13; color: #ffffff; font-family: 'Segoe UI', sans-serif; padding: 20px; }
        .header { text-align: center; margin-bottom: 20px; }
        .header h1 { color: #00ffff; font-size: 1.5rem; margin: 0; }
        .search-container { display: flex; gap: 10px; margin-bottom: 20px; }
        input[type="text"] { flex: 1; padding: 12px; border-radius: 8px; border: 1px solid #2d2d3d; background-color: #1a1a24; color: white; font-size: 1rem; }
        button { padding: 12px 20px; border-radius: 8px; border: none; background-color: #ff00ff; color: white; font-weight: bold; font-size: 1rem; cursor: pointer; }
        #results { display: flex; flex-direction: column; gap: 15px; }
        .result-item { background-color: #1a1a24; border-radius: 8px; padding: 10px; display: flex; align-items: center; gap: 15px; }
        .thumbnail { width: 120px; border-radius: 6px; }
        .info { flex: 1; display: flex; flex-direction: column; gap: 5px; }
        .title { font-size: 0.95rem; font-weight: bold; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .add-btn { background-color: transparent; border: 2px solid #00ffff; color: #00ffff; padding: 8px; font-size: 0.9rem; margin-top: 5px; }
    </style>
</head>
<body>

    <div class="header"><h1>Buscador de Canciones</h1></div>
    <div class="search-container">
        <input type="text" id="searchInput" placeholder="Buscar artista o canción...">
        <button onclick="searchYouTube()">Buscar</button>
    </div>
    <div id="results"></div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const supabaseUrl = 'https://zothgtvmkurannngxmumc.supabase.co';
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpvdGhndHZta3VyYW5uZ3htdW1jIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI5ODYxMTksImV4cCI6MjEwODU2MjExOX0.rdxY-oNicD1y9TXkAqXpaArDhDP4i_UgLazutFNbuTQ';
        const supabase = window.supabase.createClient(supabaseUrl, supabaseKey);
        
        const YOUTUBE_API_KEY = "TU_API_KEY_YOUTUBE";

        window.searchYouTube = async function() {
            const query = document.getElementById('searchInput').value;
            if (!query) return;
            const url = `https://www.googleapis.com/youtube/v3/search?part=snippet&maxResults=10&q=${encodeURIComponent(query)}&type=video&key=${YOUTUBE_API_KEY}`;
            
            try {
                const response = await fetch(url);
                const data = await response.json();
                
                if (data.error) {
                    alert("Error de YouTube: " + data.error.message);
                    return;
                }
                
                displayResults(data.items);
            } catch (error) {
                console.error("Error buscando:", error);
                alert("Error de conexión al buscar.");
            }
        };

        function displayResults(videos) {
            const resultsDiv = document.getElementById('results');
            resultsDiv.innerHTML = '';
            
            if (!videos || videos.length === 0) {
                resultsDiv.innerHTML = 'No se encontraron resultados.';
                return;
            }

            videos.forEach(video => {
                const item = document.createElement('div');
                item.className = 'result-item';
                item.innerHTML = `
                    <img class="thumbnail" src="${video.snippet.thumbnails.medium.url}" alt="Miniatura">
                    <div class="info">
                        <div class="title">${video.snippet.title}</div>
                        <button class="add-btn" onclick="addToQueue('${video.id.videoId}', '${video.snippet.title.replace(/'/g, "\\'")}')">
                            + Agregar a la fila
                        </button>
                    </div>
                `;
                resultsDiv.appendChild(item);
            });
        }

        window.addToQueue = async function(videoId, title) {
            const { error } = await supabase.from('cola_reproduccion').insert([{ video_id: videoId, title: title }]);
            if (error) {
                alert("Error al agregar a Supabase: " + error.message);
            } else {
                alert("¡Canción agregada a la fila!");
                document.getElementById('searchInput').value = '';
                document.getElementById('results').innerHTML = '';
            }
        };
    </script>
</body>
</html>
