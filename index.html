<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rockola Alaska - Reproductor TV</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            background-color: #0b0c10;
            color: #ffffff;
            font-family: 'Segoe UI', Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }
        header {
            background-color: #1f2833;
            padding: 12px 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #66fcf1;
        }
        .brand {
            font-size: 1.4rem;
            font-weight: bold;
            color: #66fcf1;
            letter-spacing: 1px;
        }
        .status-badge {
            background-color: #45a29e;
            color: #0b0c10;
            padding: 5px 12px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 0.85rem;
        }
        .main-layout {
            display: flex;
            flex: 1;
            height: calc(100vh - 60px);
        }
        #player-container {
            flex: 2.5;
            padding: 20px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            background-color: #000000;
        }
        #player {
            width: 100%;
            height: 100%;
            border-radius: 10px;
            box-shadow: 0 0 25px rgba(102, 252, 241, 0.15);
        }
        #queue-sidebar {
            flex: 1;
            background-color: #1f2833;
            padding: 20px;
            border-left: 1px solid #45a29e;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
        }
        h2 {
            margin-top: 0;
            color: #66fcf1;
            font-size: 1.2rem;
            border-bottom: 1px solid #45a29e;
            padding-bottom: 10px;
        }
        .queue-item {
            background-color: #0b0c10;
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 10px;
            border-left: 4px solid #45a29e;
            transition: all 0.3s ease;
        }
        .queue-item.playing {
            border-left-color: #66fcf1;
            box-shadow: 0 0 10px rgba(102, 252, 241, 0.3);
            background-color: #121921;
        }
        .song-title {
            font-weight: bold;
            font-size: 0.95rem;
            margin-bottom: 4px;
            color: #ffffff;
        }
        .song-meta {
            font-size: 0.8rem;
            color: #c5c6c7;
        }
    </style>
</head>
<body>

    <header>
        <div class="brand">❄️ BAR RESTAURANTE ALASKA — ROCKOLA</div>
        <div class="status-badge" id="connection-status">● Conectando...</div>
    </header>

    <div class="main-layout">
        <div id="player-container">
            <div id="player"></div>
        </div>
        <div id="queue-sidebar">
            <h2>Fila de Reproducción</h2>
            <div id="queue-list">Cargando canciones...</div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://www.youtube.com/iframe_api"></script>

    <script>
        const supabaseUrl = 'https://zothgtvmkuranngxmumc.supabase.co';
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpvdGhndHZta3VyYW5uZ3htdW1jIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI5ODYxMTksImV4cCI6MjEwODU2MjExOX0.rdxY-oNicD1y9TXkAqXpaArDhDP4i_UgLazutFNbuTQ';
        const supabase = window.supabase.createClient(supabaseUrl, supabaseKey);

        let player = null;
        let isPlayerReady = false;
        let isPlaying = false;
        let currentSongId = null;
        let queueData = [];

        window.onYouTubeIframeAPIReady = () => {
            player = new YT.Player('player', {
                playerVars: { 'autoplay': 1, 'controls': 1 },
                events: {
                    'onReady': () => {
                        isPlayerReady = true;
                        if (!isPlaying && queueData.length > 0) {
                            playNext();
                        }
                    },
                    'onStateChange': onPlayerStateChange
                }
            });
        };

        async function init() {
            await fetchQueue();
            subscribeRealtime();
        }

        async function fetchQueue() {
            try {
                const { data, error } = await supabase
                    .from('cola_reproduccion')
                    .select('*')
                    .order('created_at', { ascending: true });

                if (error) {
                    document.getElementById('queue-list').innerHTML = '<p style="color:#ff6b6b;">Error: ' + error.message + '</p>';
                    return;
                }

                queueData = data || [];
                renderQueue();
                if (isPlayerReady && !isPlaying) {
                    playNext();
                }
            } catch (err) {
                document.getElementById('queue-list').innerHTML = '<p style="color:#ff6b6b;">Error de red: ' + err.message + '</p>';
            }
        }

        function subscribeRealtime() {
            supabase.channel('custom-all-channel')
                .on('postgres_changes', { event: '*', schema: 'public', table: 'cola_reproduccion' }, (payload) => {
                    if (payload.eventType === 'INSERT') {
                        if (!queueData.some(s => s.id === payload.new.id)) {
                            queueData.push(payload.new);
                        }
                    } else if (payload.eventType === 'DELETE') {
                        queueData = queueData.filter(song => song.id !== payload.old.id);
                    }
                    renderQueue();
                    if (isPlayerReady && !isPlaying) {
                        playNext();
                    }
                }).subscribe((status) => {
                    const badge = document.getElementById('connection-status');
                    if (status === 'SUBSCRIBED') {
                        badge.style.backgroundColor = '#45a29e';
                        badge.textContent = '● En línea (Tiempo Real)';
                    } else if (status === 'CLOSED' || status === 'CHANNEL_ERROR') {
                        badge.style.backgroundColor = '#ff6b6b';
                        badge.textContent = '● Desconectado';
                    }
                });
        }

        function renderQueue() {
            const queueListDiv = document.getElementById('queue-list');
            queueListDiv.innerHTML = '';
            if (queueData.length === 0) {
                queueListDiv.innerHTML = '<p style="color:#c5c6c7;">Sin canciones en fila. Agrega desde el celular.</p>';
                return;
            }
            
            queueData.forEach((song, idx) => {
                const item = document.createElement('div');
                const isCurrent = song.id === currentSongId;
                item.className = `queue-item ${isCurrent ? 'playing' : ''}`;
                item.innerHTML = `
                    <div class="song-title">${idx + 1}. ${song.title}</div>
                    <div class="song-meta">${isCurrent ? '▶ Reproduciendo ahora' : 'Pendiente'}</div>
                `;
                queueListDiv.appendChild(item);
            });
        }

        async function onPlayerStateChange(event) {
            if (event.data === YT.PlayerState.ENDED && currentSongId) {
                await supabase.from('cola_reproduccion').delete().eq('id', currentSongId);
                queueData = queueData.filter(song => song.id !== currentSongId);
                currentSongId = null;
                isPlaying = false;
                renderQueue();
                playNext();
            }
        }

        function playNext() {
            if (isPlayerReady && !isPlaying && queueData.length > 0) {
                const nextSong = queueData[0];
                currentSongId = nextSong.id;
                isPlaying = true;
                renderQueue(); 
                player.loadVideoById(nextSong.video_id);
            }
        }

        init();
    </script>
</body>
</html>
