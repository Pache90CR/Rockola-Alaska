<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Rockola Alaska - Control Remoto</title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; background-color: #0b0c10; color: #ffffff; font-family: sans-serif; padding: 12px; }
        .header { text-align: center; margin-bottom: 12px; border-bottom: 1px solid #1f2833; padding-bottom: 8px; }
        .header h1 { color: #66fcf1; font-size: 1.2rem; margin: 0; }
        
        .search-box { display: flex; gap: 8px; margin-bottom: 12px; }
        input[type="text"] { flex: 1; padding: 12px; border-radius: 10px; border: 1px solid #45a29e; background-color: #1f2833; color: white; font-size: 0.95rem; outline: none; }
        button.btn-search { padding: 12px 16px; border-radius: 10px; border: none; background-color: #66fcf1; color: #0b0c10; font-weight: bold; font-size: 0.95rem; cursor: pointer; }

        .chips-container { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 10px; margin-bottom: 10px; scrollbar-width: none; }
        .chip { background: #1f2833; color: #c5c6c7; padding: 7px 14px; border-radius: 20px; font-size: 0.82rem; font-weight: bold; white-space: nowrap; border: 1px solid #2c3846; cursor: pointer; }
        .chip.active { background: #66fcf1; color: #0b0c10; border-color: #66fcf1; }

        #status-msg { margin-bottom: 12px; text-align: center; font-size: 0.85rem; }
        
        #results { display: flex; flex-direction: column; gap: 10px; }
        .card { background-color: #1f2833; border-radius: 10px; padding: 10px; display: flex; gap: 10px; align-items: center; border: 1px solid #2c3846; }
        .thumb { width: 90px; height: 65px; object-fit: cover; border-radius: 6px; }
        .card-info { flex: 1; display: flex; flex-direction: column; gap: 4px; }
        .card-title { font-size: 0.85rem; font-weight: bold; line-height: 1.2; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .card-btns { display: flex; gap: 6px; margin-top: 4px; }
        .btn-add { background: transparent; border: 1.5px solid #66fcf1; color: #66fcf1; padding: 6px 10px; border-radius: 6px; font-weight: bold; font-size: 0.8rem; cursor: pointer; }
        .btn-fav { background: transparent; border: 1px solid #45a29e; color: #66fcf1; padding: 6px 8px; border-radius: 6px; font-size: 0.8rem; cursor: pointer; }
    </style>
</head>
<body>

    <div class="header">
        <h1>📱 Rockola Alaska — Control</h1>
    </div>

    <form id="searchForm" class="search-box">
        <input type="text" id="searchInput" placeholder="Buscar canción o artista..." autocomplete="off">
        <button type="submit" class="btn-search">Buscar</button>
    </form>

    <div class="chips-container">
        <div class="chip active" onclick="filterGenre('Música variada para bares 2026 éxitos', this)">🌐 Inicio</div>
        <div class="chip" onclick="filterGenre('Mix regional mexicano, banda y corridos', this)">🌵 Regional Mex</div>
        <div class="chip" onclick="filterGenre('Mix dembow, reggaeton, fiesta urbana', this)">🔥 Dembow/Urbano</div>
        <div class="chip" onclick="filterGenre('Toledo dancehall Costa Rica', this)">🦁 Toledo/Dancehall</div>
        <div class="chip" onclick="filterGenre('Mix salsa y bachata bailable', this)">💃 Salsa/Bachata</div>
        <div class="chip" onclick="showFavorites(this)">⭐ Mis Favoritos</div>
    </div>

    <div id="status-msg"></div>
    <div id="results"></div>

    <script>
        const SUPABASE_URL = 'https://zothgtvmkuranngxmumc.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpvdGhndHZta3VyYW5uZ3htdW1jIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI5ODYxMTksImV4cCI6MjEwODU2MjExOX0.rdxY-oNicD1y9TXkAqXpaArDhDP4i_UgLazutFNbuTQ';
        const YOUTUBE_API_KEY = "AIzaSyAHKvpCidYJTCFasu0XsQYvCSUwHsWA4mI";

        document.getElementById('searchForm').addEventListener('submit', function(e) {
            e.preventDefault();
            searchYouTube();
        });

        // Búsqueda dinámica real hacia YouTube (trae hasta 15 resultados variados)
        async function searchYouTube(customQuery = null) {
            const query = customQuery || document.getElementById('searchInput').value.trim();
            const statusDiv = document.getElementById('status-msg');
            const resultsDiv = document.getElementById('results');

            if (!query) return;

            statusDiv.style.color = '#66fcf1';
            statusDiv.innerHTML = '🔍 Buscando música...';
            resultsDiv.innerHTML = '';

            const url = `https://www.googleapis.com/youtube/v3/search?part=snippet&maxResults=15&q=${encodeURIComponent(query)}&type=video&key=${YOUTUBE_API_KEY}`;

            try {
                const response = await fetch(url);
                const data = await response.json();
                statusDiv.innerHTML = '';
                if (data.items) displayResults(data.items.map(item => ({
                    id: item.id.videoId,
                    title: item.snippet.title,
                    thumb: item.snippet.thumbnails.medium.url
                })));
            } catch (error) {
                statusDiv.innerHTML = '<b style="color:#ff6b6b">Error al buscar. Revisa la red.</b>';
            }
        }

        function displayResults(videos) {
            const resultsDiv = document.getElementById('results');
            resultsDiv.innerHTML = '';

            videos.forEach(video => {
                const card = document.createElement('div');
                card.className = 'card';

                const img = document.createElement('img');
                img.className = 'thumb';
                img.src = video.thumb;

                const info = document.createElement('div');
                info.className = 'card-info';

                const title = document.createElement('div');
                title.className = 'card-title';
                title.textContent = video.title;

                const btns = document.createElement('div');
                btns.className = 'card-btns';

                const addBtn = document.createElement('button');
                addBtn.className = 'btn-add';
                addBtn.textContent = '+ Agregar';
                addBtn.onclick = () => addToQueue(video.id, video.title, addBtn);

                const favBtn = document.createElement('button');
                favBtn.className = 'btn-fav';
                favBtn.textContent = '⭐ Guardar';
                favBtn.onclick = () => saveFav(video.id, video.title, video.thumb);

                btns.appendChild(addBtn);
                btns.appendChild(favBtn);
                info.appendChild(title);
                info.appendChild(btns);
                card.appendChild(img);
                card.appendChild(info);

                resultsDiv.appendChild(card);
            });
        }

        function filterGenre(query, element) {
            document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
            element.classList.add('active');
            
            // Vaciar el texto del input al navegar por chips
            document.getElementById('searchInput').value = ''; 
            searchYouTube(query);
        }

        function saveFav(videoId, title, thumb) {
            let favs = JSON.parse(localStorage.getItem('alaska_favs') || '[]');
            if (!favs.some(f => f.id === videoId)) {
                favs.push({ id: videoId, title: title, thumb: thumb });
                localStorage.setItem('alaska_favs', JSON.stringify(favs));
                alert("⭐ Canción guardada en Favoritos");
            } else {
                alert("Ya está guardada en favoritos");
            }
        }

        function showFavorites(element) {
            document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
            element.classList.add('active');
            
            const favs = JSON.parse(localStorage.getItem('alaska_favs') || '[]');
            if (favs.length === 0) {
                document.getElementById('results').innerHTML = '<p style="text-align:center; color:#c5c6c7;">No tienes favoritos guardados.</p>';
            } else {
                displayResults(favs);
            }
        }

        async function addToQueue(videoId, title, buttonEl) {
            const originalText = buttonEl.textContent;
            buttonEl.textContent = "Guardando...";
            buttonEl.disabled = true;

            const endpoint = `${SUPABASE_URL}/rest/v1/cola_reproduccion`;
            try {
                const response = await fetch(endpoint, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'apikey': SUPABASE_KEY,
                        'Authorization': 'Bearer ' + SUPABASE_KEY,
                        'Prefer': 'return=minimal'
                    },
                    body: JSON.stringify([{ video_id: videoId, title: title }])
                });

                if (response.ok) {
                    buttonEl.textContent = "✓ Agregada";
                } else {
                    alert("Error guardando canción.");
                    buttonEl.textContent = originalText;
                    buttonEl.disabled = false;
                }
            } catch (err) {
                alert("Error de red.");
                buttonEl.textContent = originalText;
                buttonEl.disabled = false;
            }
        }

        // Cargar recomendaciones globales al iniciar la Rockola
        filterGenre('Música variada para bares 2026 éxitos', document.querySelector('.chip.active'));
    </script>
</body>
</html>
